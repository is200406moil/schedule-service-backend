name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: student_tasks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d student_tasks_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/student_tasks_ci
      TEST_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/student_tasks_ci
      SECRET_KEY: ci-only-secret-with-at-least-32-characters

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix ../frontend
      - name: Check React and TypeScript lint
        run: npm run lint --prefix ../frontend
      - name: Check and build React frontend
        run: npm run build --prefix ../frontend
      - name: Test React frontend
        run: npm test --prefix ../frontend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python lint
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check app tests
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt
      - name: Audit schedule parser dependencies
        run: python -m pip_audit --requirement ../infra/schedule/requirements.txt
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          for file in app/static/*.js; do
            node --check "$file"
          done
      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Check PostgreSQL migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  containers:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENVIRONMENT: production
      COOKIE_SECURE: "true"
      SECRET_KEY: ci-only-secret-with-at-least-32-characters
      # Public links require HTTPS; smoke requests below use the internal HTTP endpoint.
      PUBLIC_BASE_URL: https://semester.example.test
      MAIL_MODE: disabled

    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application stack
        run: docker compose build
      - name: Start application stack
        run: docker compose up -d --wait --wait-timeout 180 db schedule-db schedule-api app
      - name: Verify running services
        run: |
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/health
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ready
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:5000/health
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:5000/ready
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ui/login > /dev/null
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ui/register > /dev/null
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ui/forgot-password > /dev/null
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ui/password-reset > /dev/null
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ui/email-verification > /dev/null
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ui/verify-email > /dev/null
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ui/privacy > /dev/null
      - name: Verify React pages, old links and built assets
        run: |
          python - <<'PY'
          import json
          import os
          from html.parser import HTMLParser
          from uuid import uuid4
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
                  self.boot = ""
                  self.in_boot = False

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "script" and values.get("src"):
                      self.urls.append(values["src"])
                  if tag == "link" and values.get("rel") == "stylesheet":
                      self.urls.append(values["href"])
                  if tag == "script" and values.get("id") == "page-data":
                      self.in_boot = True

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.in_boot = False

              def handle_data(self, data):
                  if self.in_boot:
                      self.boot += data

          base = os.environ.get("UI_SMOKE_BASE_URL", "http://localhost:8000")

          def post_json(path, data, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = Request(base + path, data=json.dumps(data).encode(), headers=headers)
              with urlopen(request, timeout=10) as response:
                  return json.load(response)

          credentials = {"email": f"react-smoke-{uuid4().hex}@example.com", "password": "ci-react-smoke-password"}
          post_json("/auth/register", credentials)
          token = post_json("/auth/login", credentials)["access_token"]
          task_id = post_json("/tasks", {"title": "React smoke task"}, token)["id"]
          headers = {"Authorization": f"Bearer {token}"}
          checked_assets = set()

          def page(path, expected=None):
              request = Request(base + path, headers={} if expected is None else headers)
              parser = Assets()
              with urlopen(request, timeout=10) as response:
                  assert response.status == 200, path
                  assert response.url == base + path, (path, response.url)
                  html = response.read().decode()
              parser.feed(html)
              assert parser.urls and all(url.startswith("/static/react/") for url in parser.urls), path
              assert "/static/calendar.js" not in html and "/static/dashboard.js" not in html, path
              if expected is not None:
                  boot = json.loads(parser.boot)
                  for key, value in expected.items():
                      assert boot[key] == value, (path, key)
              for url in parser.urls:
                  if url not in checked_assets:
                      with urlopen(urljoin(base, url), timeout=10) as response:
                          assert response.status == 200, url
                      checked_assets.add(url)

          page("/ui/login")
          page("/ui", {})
          page("/ui/calendar?date=2026-10-02&lesson=10:40", {"initialDate": "2026-10-02", "initialLesson": "10:40"})
          page("/ui/tasks?filter=overdue", {"initialFilter": "overdue"})
          page("/ui/profile?edit=1", {"initialEdit": True})
          calendar_return = "/ui/calendar?date=2026-10-02"
          new_query = urlencode({"return_to": calendar_return, "subject": "Python"})
          page("/ui/tasks/new?" + new_query, {"taskId": None, "returnTo": calendar_return, "initialSubject": "Python"})
          page(f"/ui/tasks/{task_id}/edit", {"taskId": task_id, "returnTo": "/ui/tasks"})
          aliases = [
              ("/ui/preview", "/ui"),
              ("/ui/calendar/preview?date=2026-10-02&lesson=10:40", "/ui/calendar?date=2026-10-02&lesson=10:40"),
              ("/ui/tasks/preview?filter=overdue", "/ui/tasks?filter=overdue"),
              ("/ui/profile/preview?edit=1", "/ui/profile?edit=1"),
              ("/ui/tasks/new/preview?" + new_query, "/ui/tasks/new?" + new_query),
              (f"/ui/tasks/{task_id}/edit/preview", f"/ui/tasks/{task_id}/edit"),
          ]
          for old, canonical in aliases:
              with urlopen(Request(base + old, headers=headers), timeout=10) as response:
                  assert response.status == 200 and response.url == base + canonical, old
                  assert 'id="page-data"' in response.read().decode(), old
          print(f"Verified 7 React pages, 6 old links and {len(checked_assets)} built assets")
          PY
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
