name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: student_tasks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d student_tasks_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/student_tasks_ci
      TEST_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/student_tasks_ci
      SECRET_KEY: ci-only-secret-with-at-least-32-characters

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Check Python lint
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check app tests
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements-dev.lock
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          for file in app/static/*.js; do
            node --check "$file"
          done
      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Check PostgreSQL migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  containers:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENVIRONMENT: production
      COOKIE_SECURE: "true"
      SECRET_KEY: ci-only-secret-with-at-least-32-characters

    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application stack
        run: docker compose build
      - name: Start application stack
        run: docker compose up -d --wait --wait-timeout 180 db schedule-db schedule-api app
      - name: Verify running services
        run: |
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/health
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ready
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:5000/health
          curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:8000/ui/login > /dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
